name: Darwin CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: darwin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin:
    name: macOS and iOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          swift --version

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze Dart sources
        run: flutter analyze lib test

      - name: Run Dart tests
        run: flutter test

      - name: Run Rust tests
        working-directory: rust
        run: cargo test

      - name: Check Rust lints (Clippy)
        working-directory: rust
        run: cargo clippy -- -D warnings
      - name: Build macOS example
        working-directory: example
        run: flutter build macos --debug

      - name: Build macOS RunnerTests
        working-directory: example/macos
        run: |
          xcodebuild build-for-testing \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination 'platform=macOS'

      - name: Build iOS simulator example
        working-directory: example
        run: flutter build ios --debug --simulator --no-codesign

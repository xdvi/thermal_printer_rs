services:
  # Virtual ESC/POS printer — listens on TCP port 9100
  # Receives raw ESC/POS bytes and converts them to PDF/PNG for inspection
  virtual-printer:
    image: rpemberton/escpos-server:latest
    container_name: thermal_virtual_printer
    ports:
      - "9100:9100"     # ESC/POS data port (standard)
      - "8080:8080"     # HTTP API to retrieve last print as PNG/PDF
    volumes:
      - printer_output:/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9100"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional: web viewer for rendered tickets
  ticket-viewer:
    image: nginx:alpine
    container_name: thermal_ticket_viewer
    ports:
      - "8181:80"
    volumes:
      - printer_output:/usr/share/nginx/html/output:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      virtual-printer:
        condition: service_healthy
    restart: unless-stopped

volumes:
  printer_output:

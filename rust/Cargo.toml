[package]
name    = "thermal_printer_rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# ──────────────────────────────────────────────
# Feature flags (compile-time transports)
# ──────────────────────────────────────────────
[features]
default     = ["tcp", "graphics", "codes_2d", "barcodes"]
tcp         = []
usb         = ["dep:nusb"]
ble         = ["dep:btleplug", "dep:uuid"]
graphics    = ["escpos/graphics"]
codes_2d    = ["escpos/codes_2d"]
barcodes    = ["escpos/barcodes"]
full        = ["tcp", "usb", "ble", "graphics", "codes_2d", "barcodes"]

[dependencies]
# Bridge FFI
flutter_rust_bridge = "=2.12.0"

# ESC/POS protocol — núcleo del sistema
escpos = { version = "0.17", default-features = false, features = ["codes_2d", "barcodes"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Transportes opcionales
nusb     = { version = "0.2", optional = true, features = ["tokio"] }
btleplug = { version = "0.11", optional = true }
uuid     = { version = "1", features = ["v4"], optional = true }

# Errores tipados
thiserror = "1"

# Logging estructurado
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Utilidades thread-safe
once_cell   = "1"
parking_lot = "0.12"
async-trait = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "performance_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
